<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المراجعة والاعتماد | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .form-section { background:#fff; border-radius:14px; padding:22px; box-shadow:var(--shadow-card); border:1px solid var(--border); margin-bottom:20px; }
  .form-section h4 { color:var(--maroon-900); font-size:1.02rem; margin-bottom:16px; border-bottom:2px solid var(--gold-100); padding-bottom:10px; }
  .checklist-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .checklist-item:last-child { border-bottom:none; }
  .status-banner { border-radius:14px; padding:18px; margin-bottom:20px; display:flex; align-items:center; gap:14px; }
  .status-banner.draft { background:#f1f1f2; color:var(--text-main); }
  .status-banner.submitted, .status-banner.unit_approved, .status-banner.dept_approved { background:#fbf1dd; color:var(--maroon-800); }
  .status-banner.approved { background:#e8f6ee; color:var(--status-done); }
  .status-banner.returned, .status-banner.rejected { background:#fdecea; color:var(--status-fail); }
  .status-banner .icon { font-size:1.8rem; }
  .timeline-item { border-right:3px solid var(--gold-500); padding:8px 16px; margin-bottom:8px; font-size:.85rem; }
  .timeline-item .meta { color:var(--text-muted); font-size:.76rem; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:800px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-signature"></i> المراجعة والاعتماد</h2>
  </div>

  <div class="status-banner" id="statusBanner"></div>

  <div class="form-section">
    <h4>قائمة التحقق قبل الإرسال</h4>
    <div id="checklistBox"></div>
  </div>

  <div class="form-section" id="submitBox">
    <h4>إرسال للاعتماد</h4>
    <p class="text-muted small">بعد الإرسال، لا يمكن تعديل بيانات التقرير إلا إذا أُعيد إليك من إحدى المراجعات.</p>
    <button type="button" class="btn-primary" id="submitBtn" style="width:auto; padding:12px 32px;">
      <i class="fa-solid fa-paper-plane"></i> إرسال التقرير للاعتماد
    </button>
  </div>

  <div class="form-section" id="historyBox" style="display:none;">
    <h4>سجل المراجعة</h4>
    <div id="historyList"></div>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport } from "../js/report-state.js";
  import { submitForReview, STATUS_LABELS_AR } from "../js/firebase/workflow.js";
  import { showSaveToast } from "../js/components/form-helpers.js";
  import { SECTIONS } from "../js/components/sections-config.js";

  let reportId, report, profileRef;

  const STATUS_ICONS = {
    draft: "fa-file-pen",
    submitted: "fa-hourglass-half",
    unit_approved: "fa-hourglass-half",
    dept_approved: "fa-hourglass-half",
    approved: "fa-circle-check",
    returned: "fa-rotate-left",
    rejected: "fa-circle-xmark"
  };

  requireAuth(async (profile) => {
    profileRef = profile;
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    reportId = await getOrCreateDraftReport(profile);
    report = await loadReport(reportId);
    renderStatus();
    renderChecklist();
    renderHistory();
    document.getElementById("submitBtn").addEventListener("click", onSubmit);
  });

  function renderStatus() {
    const status = report?.status || "draft";
    const banner = document.getElementById("statusBanner");
    banner.className = `status-banner ${status}`;
    banner.innerHTML = `
      <i class="fa-solid ${STATUS_ICONS[status]} icon"></i>
      <div>
        <div style="font-weight:700;">${STATUS_LABELS_AR[status]}</div>
        <div class="small">${status === "draft" ? "التقرير لسه مسودة، أكملي الأقسام ثم أرسليه للاعتماد" : ""}</div>
      </div>
    `;

    const submitBox = document.getElementById("submitBox");
    submitBox.style.display = (status === "draft" || status === "returned") ? "block" : "none";
  }

  function renderChecklist() {
    const box = document.getElementById("checklistBox");
    box.innerHTML = SECTIONS.map(s => {
      const key = sectionKeyToDataKey(s.key);
      const value = report?.[key];
      const filled = s.repeatable ? (Array.isArray(value) && value.length > 0) : (value && Object.keys(value).length > 0);
      return `
        <div class="checklist-item">
          <i class="fa-solid ${filled ? "fa-circle-check" : "fa-circle"} ${filled ? "text-success" : "text-muted"}"></i>
          <span>${s.title}</span>
          <span class="ms-auto small ${filled ? "text-success" : "text-muted"}">${filled ? "مكتمل" : "فارغ"}</span>
        </div>`;
    }).join("");
  }

  function sectionKeyToDataKey(key) {
    const map = {
      "basic-data": "basicData", "goals": "goals", "indicators": "indicators",
      "programs": "programs", "measurement-tools": "measurementTools",
      "results-analysis": "resultsAnalysis", "strengths": "strengths",
      "difficulties": "difficulties", "improvement-opportunities": "improvementOpportunities",
      "initiatives": "initiatives", "impact-stories": "impactStories",
      "recommendations": "recommendations", "next-period-plan": "nextPeriodPlan",
      "evidence": "evidence", "review-approval": "reviewApproval"
    };
    return map[key] || key;
  }

  function renderHistory() {
    const history = report?.history || [];
    if (history.length === 0) return;
    document.getElementById("historyBox").style.display = "block";
    document.getElementById("historyList").innerHTML = history.slice().reverse().map(h => `
      <div class="timeline-item">
        <div>${actionLabel(h.action)} — ${h.note || ""}</div>
        <div class="meta">${h.by} · ${new Date(h.at).toLocaleString("ar-SA")}</div>
      </div>
    `).join("");
  }

  function actionLabel(action) {
    return { submit: "تم الإرسال للاعتماد", approve: "تم الاعتماد", return: "أُعيد للتعديل", reject: "تم الرفض" }[action] || action;
  }

  async function onSubmit() {
    try {
      await submitForReview(reportId, profileRef);
      showSaveToast("تم إرسال التقرير للاعتماد بنجاح");
      report = await loadReport(reportId);
      renderStatus();
      renderHistory();
    } catch (err) {
      console.error(err);
      showSaveToast("تعذر الإرسال، حاولي مجددًا", true);
    }
  }
</script>
</body>
</html>
