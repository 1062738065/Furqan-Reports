<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المعلومات — نظام توثيق الأداء</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="" id="logo-img" alt="">
        <div class="title">نظام توثيق الأداء</div>
      </div>

      <div class="sidebar-group-label">الرئيسية</div>
      <a href="#" class="nav-item" data-view="home">🏠 لوحة المعلومات</a>

      <div class="sidebar-group-label">إدارة التقارير</div>
      <a href="#" class="nav-item" data-view="units-overview">🗂️ الأقسام والوحدات</a>
      <a href="#" class="nav-item" data-view="units-manage">🏢 إدارة الأقسام والوحدات</a>
      <a href="#" class="nav-item" data-view="indicators-manage">📊 إدارة مؤشرات الأداء</a>
      <a href="#" class="nav-item" data-view="goals-manage">🎯 إدارة الأهداف والمستهدفات</a>

      <div class="sidebar-footer">
        <button class="btn btn-outline btn-sm" style="width: 100%;" onclick="logout()">تسجيل الخروج</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div id="page-title" style="font-weight: 800; font-size: 16px;">لوحة المعلومات</div>
        <div class="who" id="who"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="logo-config.js"></script>
  <script src="config.js"></script>
  <script>
    const user = requireSession("admin");
    document.getElementById("logo-img").src = ASSOCIATION_LOGO;
    if (user) document.getElementById("who").textContent = user.name;

    let departments = [];
    let units = [];

    /* ============================= التنقل ============================= */
    const titles = {
      "home": "لوحة المعلومات",
      "units-overview": "الأقسام والوحدات",
      "units-manage": "إدارة الأقسام والوحدات",
      "indicators-manage": "إدارة مؤشرات الأداء",
      "goals-manage": "إدارة الأهداف والمستهدفات",
    };

    document.querySelectorAll(".nav-item").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        navigate(a.dataset.view);
      });
    });

    async function navigate(view) {
      document.querySelectorAll(".nav-item").forEach(function (a) {
        a.classList.toggle("active", a.dataset.view === view);
      });
      document.getElementById("page-title").textContent = titles[view] || "";
      const content = document.getElementById("content");
      content.innerHTML = '<div class="empty-state">جارِ التحميل...</div>';

      if (view === "home") return renderHome();
      if (view === "units-overview") return renderUnitsOverview();
      if (view === "units-manage") return renderUnitsManage();
      if (view === "indicators-manage") return renderPlaceholder("قسم إدارة مؤشرات الأداء قيد الإنشاء حاليًا.");
      if (view === "goals-manage") return renderPlaceholder("قسم إدارة الأهداف والمستهدفات قيد الإنشاء حاليًا.");
    }

    function renderPlaceholder(msg) {
      document.getElementById("content").innerHTML =
        '<div class="card"><div class="empty-state">🚧 ' + escapeHtml(msg) + '</div></div>';
    }

    /* ============================= تحميل البيانات ============================= */
    async function loadCoreData() {
      departments = await getData(KEYS.DEPARTMENTS, []);
      units = await getData(KEYS.UNITS, []);
    }

    /* ============================= لوحة المعلومات ============================= */
    async function renderHome() {
      await loadCoreData();
      const activeUnits = units.filter(function (u) { return u.status === "active"; }).length;
      const reportCounts = await Promise.all(units.map(async function (u) {
        const report = await getData(KEYS.report(u.id), null);
        const total = report && report.sections ? Object.keys(report.sections).length : 0;
        return total > 0 ? 1 : 0;
      }));
      const startedReports = reportCounts.reduce(function (a, b) { return a + b; }, 0);

      document.getElementById("content").innerHTML =
        '<div class="grid grid-3">' +
          statCard(departments.length, "الأقسام") +
          statCard(activeUnits, "الوحدات النشطة") +
          statCard(startedReports, "تقارير بدأت التعبئة") +
        '</div>' +
        '<div class="card" style="margin-top: 18px;">' +
          '<div style="font-weight: 800; margin-bottom: 12px;">أحدث الوحدات</div>' +
          renderUnitsTable(units.slice(-5).reverse()) +
        '</div>';
    }

    function statCard(num, label) {
      return '<div class="card stat-card"><div class="num">' + num + '</div><div class="label">' + escapeHtml(label) + '</div></div>';
    }

    /* ============================= الأقسام والوحدات (استعراض) ============================= */
    async function renderUnitsOverview() {
      await loadCoreData();
      let html = '';
      if (!departments.length) {
        html = '<div class="card"><div class="empty-state">لا توجد أقسام بعد. أضيفيها من "إدارة الأقسام والوحدات".</div></div>';
      } else {
        departments.forEach(function (dept) {
          const deptUnits = units.filter(function (u) { return u.departmentId === dept.id; });
          html += '<div class="card" style="margin-bottom: 16px;">' +
            '<div style="font-weight: 800; margin-bottom: 10px;">' + escapeHtml(dept.name) + '</div>' +
            (deptUnits.length ? renderUnitsTable(deptUnits) : '<div class="empty-state">لا توجد وحدات في هذا القسم بعد.</div>') +
            '</div>';
        });
      }
      document.getElementById("content").innerHTML = html;
    }

    function renderUnitsTable(list) {
      if (!list.length) return '<div class="empty-state">لا توجد بيانات.</div>';
      let rows = list.map(function (u) {
        const badge = u.status === "active" ? '<span class="badge badge-green">نشطة</span>' : '<span class="badge badge-gray">معطّلة</span>';
        return '<tr><td>' + escapeHtml(u.name) + '</td><td>' + badge + '</td></tr>';
      }).join("");
      return '<div class="table-wrap"><table class="prs-table"><thead><tr><th>اسم الوحدة</th><th>الحالة</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    /* ============================= إدارة الأقسام والوحدات ============================= */
    async function renderUnitsManage() {
      await loadCoreData();
      let html = '<div class="grid" style="grid-template-columns: 1fr 1fr; gap: 18px;">';

      // الأقسام
      html += '<div class="card">' +
        '<div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px;">' +
        '<div style="font-weight:800;">الأقسام</div>' +
        '<button class="btn btn-primary btn-sm" onclick="openDeptModal()">+ إضافة قسم</button></div>' +
        (departments.length ? renderDeptTable() : '<div class="empty-state">لا توجد أقسام بعد.</div>') +
        '</div>';

      // الوحدات
      html += '<div class="card">' +
        '<div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px;">' +
        '<div style="font-weight:800;">الوحدات</div>' +
        '<button class="btn btn-primary btn-sm" onclick="openUnitModal()">+ إضافة وحدة</button></div>' +
        (units.length ? renderUnitManageTable() : '<div class="empty-state">لا توجد وحدات بعد.</div>') +
        '</div>';

      html += '</div>';
      document.getElementById("content").innerHTML = html;
    }

    function renderDeptTable() {
      const rows = departments.map(function (d) {
        const badge = d.status === "active" ? '<span class="badge badge-green">نشط</span>' : '<span class="badge badge-gray">معطّل</span>';
        return '<tr><td>' + escapeHtml(d.name) + '</td><td>' + badge + '</td>' +
          '<td><button class="btn btn-outline btn-sm" onclick="toggleDeptStatus(\'' + d.id + '\')">' + (d.status === "active" ? "تعطيل" : "تفعيل") + '</button></td></tr>';
      }).join("");
      return '<div class="table-wrap"><table class="prs-table"><thead><tr><th>الاسم</th><th>الحالة</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    function renderUnitManageTable() {
      const rows = units.map(function (u) {
        const dept = departments.find(function (d) { return d.id === u.departmentId; });
        const badge = u.status === "active" ? '<span class="badge badge-green">نشطة</span>' : '<span class="badge badge-gray">معطّلة</span>';
        return '<tr><td>' + escapeHtml(u.name) + '</td><td>' + escapeHtml(dept ? dept.name : "—") + '</td><td>' + badge + '</td>' +
          '<td><button class="btn btn-outline btn-sm" onclick="toggleUnitStatus(\'' + u.id + '\')">' + (u.status === "active" ? "تعطيل" : "تفعيل") + '</button></td></tr>';
      }).join("");
      return '<div class="table-wrap"><table class="prs-table"><thead><tr><th>الاسم</th><th>القسم</th><th>الحالة</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    /* ============================= نافذة إضافة قسم ============================= */
    function openDeptModal() {
      openModal(
        '<h3>إضافة قسم جديد</h3>' +
        '<div class="field"><label>اسم القسم <span class="req">*</span></label><input class="input" id="dept-name"></div>' +
        '<div class="modal-actions">' +
        '<button class="btn btn-primary" style="flex:1;" onclick="saveDept()">حفظ</button>' +
        '<button class="btn btn-outline" style="flex:1;" onclick="closeModal()">إلغاء</button>' +
        '</div>'
      );
    }
    async function saveDept() {
      const name = document.getElementById("dept-name").value.trim();
      if (!name) { showToast("أدخلي اسم القسم"); return; }
      departments.push({ id: uid("dept"), name: name, status: "active", createdAt: Date.now() });
      await setData(KEYS.DEPARTMENTS, departments);
      closeModal();
      showToast("تمت إضافة القسم");
      renderUnitsManage();
    }
    async function toggleDeptStatus(id) {
      const dept = departments.find(function (d) { return d.id === id; });
      if (!dept) return;
      dept.status = dept.status === "active" ? "inactive" : "active";
      await setData(KEYS.DEPARTMENTS, departments);
      renderUnitsManage();
    }

    /* ============================= نافذة إضافة وحدة ============================= */
    function openUnitModal() {
      if (!departments.length) { showToast("أضيفي قسمًا أولاً"); return; }
      const options = departments.map(function (d) { return '<option value="' + d.id + '">' + escapeHtml(d.name) + '</option>'; }).join("");
      openModal(
        '<h3>إضافة وحدة جديدة</h3>' +
        '<div class="field"><label>اسم الوحدة <span class="req">*</span></label><input class="input" id="unit-name"></div>' +
        '<div class="field"><label>القسم <span class="req">*</span></label><select class="input" id="unit-dept">' + options + '</select></div>' +
        '<div class="modal-actions">' +
        '<button class="btn btn-primary" style="flex:1;" onclick="saveUnit()">حفظ</button>' +
        '<button class="btn btn-outline" style="flex:1;" onclick="closeModal()">إلغاء</button>' +
        '</div>'
      );
    }
    async function saveUnit() {
      const name = document.getElementById("unit-name").value.trim();
      const departmentId = document.getElementById("unit-dept").value;
      if (!name) { showToast("أدخلي اسم الوحدة"); return; }
      units.push({ id: uid("unit"), name: name, departmentId: departmentId, status: "active", createdAt: Date.now() });
      await setData(KEYS.UNITS, units);
      closeModal();
      showToast("تمت إضافة الوحدة");
      renderUnitsManage();
    }
    async function toggleUnitStatus(id) {
      const u = units.find(function (u) { return u.id === id; });
      if (!u) return;
      u.status = u.status === "active" ? "inactive" : "active";
      await setData(KEYS.UNITS, units);
      renderUnitsManage();
    }

    /* ============================= النافذة المنبثقة العامة ============================= */
    function openModal(html) {
      document.getElementById("modal-box").innerHTML = html;
      document.getElementById("modal-overlay").classList.add("open");
    }
    function closeModal() {
      document.getElementById("modal-overlay").classList.remove("open");
    }
    document.getElementById("modal-overlay").addEventListener("click", function (e) {
      if (e.target === this) closeModal();
    });

    /* ============================= البداية ============================= */
    if (user) navigate("home");
  </script>
</body>
</html>
