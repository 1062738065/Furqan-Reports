<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام توثيق الأداء</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-wrap { width: 100%; max-width: 400px; }
  .login-card { text-align: center; }
  .login-card img { width: 96px; height: auto; margin: 0 auto 14px; display: block; }
  .login-title { font-size: 20px; font-weight: 900; }
  .login-sub { font-size: 12px; color: var(--subtle); margin-top: 6px; margin-bottom: 26px; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-left: 38px; }
  .pw-toggle { position: absolute; top: 50%; left: 10px; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 15px; }
  .login-error { background: var(--danger-bg); color: var(--danger); font-size: 12.5px; border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; display: none; }
  .login-note { text-align: center; font-size: 11px; color: var(--subtle); margin-top: 16px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <img src="" id="logo-img" alt="جمعية فرقان لتحفيظ القرآن الكريم بالطائف">
      <div class="login-title">نظام توثيق الأداء</div>
      <div class="login-sub">تسجيل الدخول للمتابعة</div>

      <form id="login-form" style="text-align: start;">
        <div class="field">
          <label>اسم المستخدم <span class="req">*</span></label>
          <input class="input" id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label>كلمة السر <span class="req">*</span></label>
          <div class="pw-wrap">
            <input class="input" id="password" type="password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" onclick="togglePassword('password', this)">👁️</button>
          </div>
        </div>

        <div class="login-error" id="login-error"></div>

        <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%;">
          تسجيل الدخول
        </button>
      </form>
    </div>
    <div class="login-note">الحسابات مرتبطة بجدول Google Sheets — راجعي ورقة "المستخدمون"</div>
  </div>

  <script src="logo-config.js"></script>
  <script src="config.js"></script>
  <script>
    document.getElementById("logo-img").src = ASSOCIATION_LOGO;

    // إذا كانت فيه جلسة محفوظة أصلاً، حوّلي مباشرة بدون ما تطلبين دخول مرة ثانية
    (function () {
      const user = getSession();
      if (user) window.location.href = user.role === "admin" ? "dashboard.html" : "unit.html";
    })();

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorBox.style.display = "none";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "جارِ الدخول...";

      const res = await callApi("login", { username: username, password: password });

      btn.disabled = false;
      btn.textContent = "تسجيل الدخول";

      if (!res || !res.ok || !res.user) {
        errorBox.textContent = (res && res.error) || "تعذر الاتصال بالخادم، حاولي مرة أخرى";
        errorBox.style.display = "block";
        return;
      }

      saveSession(res.user);
      window.location.href = res.user.role === "admin" ? "dashboard.html" : "unit.html";
    });
  </script>
</body>
</html>
